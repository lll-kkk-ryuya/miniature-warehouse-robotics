# collision_monitor.yaml — per-bot physical proximity reflex stop (R-39 / #126).
#
# WHY (docs/shared/07-research-notes.md:249 R-39): the Emergency Guardian's amcl_pose-based
# proximity check is AMCL-rate-limited (~100-200ms effective stale) and Python (GC/GIL =
# no bounded worst-case, R-40). The physical proximity reflex is DELEGATED to this C++,
# high-rate, amcl-independent nav2_collision_monitor — "補完 not 置換" (doc12:545③): the
# Guardian keeps battery / event / LLM-review / pose-freshness(#152) / blocked policy +
# its prio-100 e-stop; collision_monitor only adds a fast scan-polygon stop on the nav path.
#
# TOPOLOGY (doc12:529-535) — inserted on the Nav2 velocity path, UPSTREAM of twist_mux's
# priority-10 nav2 input (emergency priority-100 is FROZEN + untouched, doc15:389-395):
#   controller_server --(remap cmd_vel -> cmd_vel/nav2_raw, Mode A/B)--> collision_monitor
#       --> cmd_vel/nav2 (the EXISTING twist_mux prio-10 input) --> twist_mux --> /bot{n}/cmd_vel
# collision_monitor publishes to cmd_vel/nav2 ONLY; it NEVER writes cmd_vel/emergency, so the
# Guardian's prio-100 override semantics stay intact (doc12:545②, R-26 safety regression).
#
# PER-BOT: one instance per robot inside namespace /bot{n} (like nav2_params.yaml / twist_mux.
# yaml). Topics are RELATIVE -> /bot{n}/cmd_vel/nav2_raw, /bot{n}/cmd_vel/nav2, /bot{n}/scan,
# /bot{n}/virtual_scan. The "<robot_namespace>" frame token is substituted to bot1/bot2 by
# ReplaceString in nav2_bringup.launch.py (TF frames are global, not namespaced by node ns).
#
# MODE (doc12:550, 11a:317): started ONLY in Mode A/B (traffic_mode != open-rmf). Mode C
# (Open-RMF) owns inter-robot traffic, so the launch gates this node OFF and routes the
# controller straight to cmd_vel/nav2 (the Mode-C real-/scan-only collision_monitor variant
# is deferred to Mode-C impl, doc12:550).
#
# virtual_scan is a DUAL-CONSUMER (doc12:547): collision_monitor is an ADDITIONAL subscriber
# of /bot{n}/virtual_scan; the costmap obstacle_layer (nav2_params.yaml:221,274) keeps it for
# planning. Same topic, two consumers — not a move.
#
# PROVISIONAL VALUES (validated live = #126 PoC, 2-bot Gazebo, human Docker gate):
#   * PolygonStop.radius / shape — footprint-grounded (ROBOT_RADIUS 0.075 from
#     warehouse_description.robot_dimensions, itself PROVISIONAL until Phase-1). TWO binding
#     constraints (Open ② = doc12:552②): (a) the 200mm R-42 aisle (doc07:252) — a stop zone
#     wider than the ~0.1m wall clearance trips on the walls; (b) the #156 head-on demo — at
#     0.15m centres the other robot's surface is ~0.075m away (INSIDE this 0.09 stop), so it
#     would mask the avoidance footage. Tune live; a forward-biased polygon may be needed.
#   * source_timeout / sensor loss — HUMBLE 1.1.20 semantics (ADR-0008), verified on the humble
#     branch (参照日 2026-09-16; doc12 末尾【2026-09-14 追補】+【2026-09-16 追補】): a source that is
#     absent or stale only DROPS ITS POINTS (scan.cpp Scan::getData returns early; process() starts
#     from DO_NOTHING), so a dead /scan lets cmd_vel PASS THROUGH = FAIL-OPEN. The "invalid source
#     -> STOP" measured by the #126 live PoC (tests/e2e/README.md:272) is Jazzy/main-only (that PoC ran
#     ros-jazzy-navigation2, deploy/dev/install-nav2-e2e.sh:21). Per-source `<src>.source_timeout`
#     is NOT declared on Humble (source.cpp getCommonParameters reads .topic/.enabled only): the
#     node-level 1.0 applies to EVERY source and virtual_scan's 0.0 at :90 is inert (harmless: with
#     no invalid-source STOP its silence cannot false-trip). Lidar-liveness stop (R-39) -> doc12.
collision_monitor:
  ros__parameters:
    use_sim_time: true   # launch RewrittenYaml overrides from use_sim_time arg (prod=false)
    base_frame_id: "<robot_namespace>/base_link"
    odom_frame_id: "<robot_namespace>/odom"
    # Velocity gate: IN = controller output (remapped to cmd_vel/nav2_raw in Mode A/B),
    # OUT = cmd_vel/nav2 = the existing twist_mux prio-10 input (prio-100 emergency untouched).
    cmd_vel_in_topic: "cmd_vel/nav2_raw"
    cmd_vel_out_topic: "cmd_vel/nav2"
    state_topic: "collision_monitor_state"   # INERT on Humble 1.1.20: param + nav2_msgs/CollisionMonitorState are main-only -> NO state topic exists here (doc12:558 surfacing path unavailable)
    transform_tolerance: 0.2
    source_timeout: 1.0          # node-level; on Humble it applies to ALL sources (per-source key not
                                 # read). Stale/absent source = its points dropped, NOT a STOP (fail-open).
    base_shift_correction: true
    stop_pub_timeout: 2.0        # Humble: timed from the FIRST zero output; afterwards CM publishes NOTHING even if the obstacle stays -> twist_mux nav2 input expires (0.5s) -> m1_driver W-1 (0.5s) brakes. Silence, not a held zero.
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      # PROVISIONAL: > inscribed ROBOT_RADIUS 0.075 (warehouse_description.robot_dimensions;
      # provisional until Phase-1) + reaction margin. Binding constraints: R-42 200mm aisle AND
      # the #156 >=0.15m head-on demo (see header) — retune live (Open ②).
      radius: 0.09
      action_type: "stop"
      min_points: 4              # INERT on Humble 1.1.20 (param there is `max_points`, default 3 = stop when >3 i.e. >=4 points: same threshold; `min_points` is Iron+). Value kept as the pinned intent.
      visualize: true
      polygon_pub_topic: "collision_monitor/polygon_stop"
      enabled: true
    # scan = real MS200 (doc03:78); virtual_scan = the other robot as a virtual obstacle
    # (Mode A/B only, doc03:109). Both relative -> /bot{n}/{scan,virtual_scan}.
    observation_sources: ["scan", "virtual_scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: true
    virtual_scan:
      type: "scan"
      topic: "virtual_scan"
      enabled: true
      # virtual_scan is a CONDITIONAL publisher: SILENT when the robots are >1.0m apart
      # (SUPPRESSION_RANGE, virtual_scan_logic.py:22). Its absence = "no nearby robot", NOT a
      # sensor fault. On Humble 1.1.20 this per-source key is NOT READ (node-level 1.0 applies) and
      # a silent source merely contributes no points, so >1.0m driving cannot false-STOP anyway.
      # Kept unchanged as the Jazzy/main-forward intent (there, 0.0 disables the stale check).
      source_timeout: 0.0
